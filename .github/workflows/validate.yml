name: Validate Cursor Craft source
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  source-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Preserve LF source bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned full SHA
        with:
          persist-credentials: false
      - name: Validate source, tests, and artifacts without third-party dependencies
        shell: bash
        run: |
          python --version
          python tools/validate_package.py
          python -m unittest discover -s tests -v
          python tools/compare_runs.py examples/benchmarks/empty-measurements.json
          python tools/release_readiness.py examples/runtime-acceptance-template.json
          python tools/build_release.py --output "$RUNNER_TEMP/cursor-craft-a.zip"
          python tools/build_release.py --output "$RUNNER_TEMP/cursor-craft-b.zip"
          python tools/verify_archive.py "$RUNNER_TEMP/cursor-craft-a.zip"
          python tools/verify_archive.py "$RUNNER_TEMP/cursor-craft-b.zip"
          python -c 'import hashlib, pathlib, os; p=pathlib.Path(os.environ["RUNNER_TEMP"]); a=(p/"cursor-craft-a.zip").read_bytes(); b=(p/"cursor-craft-b.zip").read_bytes(); assert hashlib.sha256(a).digest() == hashlib.sha256(b).digest(), "Nonreproducible ZIPs"'
          python -c 'import os, pathlib, zipfile; p=pathlib.Path(os.environ["RUNNER_TEMP"]); zipfile.ZipFile(p/"cursor-craft-a.zip").extractall(p/"cursor-craft-clean")'
          python "$RUNNER_TEMP/cursor-craft-clean/cursor-craft/tools/validate_package.py"
          python -m unittest discover -s "$RUNNER_TEMP/cursor-craft-clean/cursor-craft/tests" -v
